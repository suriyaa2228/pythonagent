<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playwright Agent Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
                <h2>PW Agent</h2>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-target="test-runner-view">
                    <i class="fa-solid fa-play"></i>
                    <span>Test Runner</span>
                </button>
                <button class="nav-item" data-target="reports-view">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Reports Dashboard</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <h1 id="page-title">Test Runner</h1>
                <div class="header-actions">
                    <div class="status-indicator">
                        <span class="pulse"></span>
                        <span class="status-text">Server Online</span>
                    </div>
                </div>
            </header>

            <!-- Test Runner View -->
            <section id="test-runner-view" class="view active">
                <div class="content-grid">
                    <div class="card available-tests-card">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-list-check"></i> Available Tests</h3>
                            <button id="refresh-tests-btn" class="icon-btn" title="Refresh Tests"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                        <div class="card-body">
                            <div class="controls">
                                <select id="env-selector" class="form-select" style="margin-right: 10px; padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc;">
                                    <option value="stage">Stage</option>
                                    <option value="dev">Dev</option>
                                </select>
                                <button id="run-selected-btn" class="btn primary" disabled>Run Selected</button>
                                <button id="run-all-btn" class="btn secondary">Run All (Suite)</button>
                            </div>
                            <div class="test-list-container">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th width="40"><input type="checkbox" id="select-all"></th>
                                            <th>Test ID</th>
                                            <th>Name</th>
                                            <th width="100">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tests-table-body">
                                        <!-- Populated via JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="card active-executions-card">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-bolt"></i> Executions</h3>
                        </div>
                        <div class="card-body">
                            <div id="executions-container">
                                <!-- Populated via JS -->
                                <div class="empty-state">No active executions.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Reports Dashboard View -->
            <section id="reports-view" class="view" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fa-solid fa-folder-open"></i> Local Reports History</h3>
                        <button id="refresh-reports-btn" class="icon-btn" title="Refresh Reports"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                    <div class="card-body">
                        <div class="reports-grid" id="reports-grid-container">
                            <!-- Populated via JS -->
                            <div class="empty-state">No reports generated yet.</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Execution Modal -->
    <div id="execution-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-test-id">Execution Details</h3>
                <button class="close-btn"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="status-banner" id="modal-status-banner">
                    <span id="modal-status">QUEUED</span>
                </div>
                <div class="progress-container" id="modal-progress-container">
                    <div class="progress-bar" id="modal-progress-bar"></div>
                </div>
                <div class="logs-container">
                    <h4>Console Output</h4>
                    <pre id="modal-logs" class="terminal"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=2"></script>
</body>
</html>
